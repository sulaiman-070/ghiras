<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FAF7F2">
  <meta name="description" content="غِراس — تطبيق لبناء عادات روحية متدرجة ومستمرة. القليل المستمر أفضل من الكثير المنقطع.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="غِراس">

  <title>غِراس — GHIRAS</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Scheherazade+New:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="src/styles/tokens.css?v=3.6">
  <link rel="stylesheet" href="src/styles/base.css?v=3.6">
  <link rel="stylesheet" href="src/styles/components.css?v=3.6">
  <link rel="stylesheet" href="src/styles/animations.css?v=3.6">

  <style>
    /* ── Loading Screen ── */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #FAF7F2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 1.5rem;
      transition: opacity 0.4s ease;
    }

    #loading-screen.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      width: 5rem;
      height: 5rem;
      border-radius: 1.5rem;
      background: #2C2219;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      box-shadow: 0 16px 40px rgba(44,34,25,0.2);
      animation: float 2s ease-in-out infinite;
    }

    .loading-app-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #2C2219;
      letter-spacing: -0.02em;
    }

    .loading-tagline {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.875rem;
      color: #6E6053;
      text-align: center;
      max-width: 220px;
      line-height: 1.6;
    }

    .loading-dots {
      display: flex;
      gap: 0.5rem;
    }

    .loading-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #B88E4F;
      animation: loadingDot 1.4s ease-in-out infinite;
    }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes loadingDot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ── App Shell ── */
    #app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-logo">🌿</div>
    <div class="loading-app-name">غِراس</div>
    <div class="loading-tagline">القليل المستمر أفضل من الكثير المنقطع</div>
    <div class="loading-dots">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
  </div>

  <!-- App Root -->
  <div id="app">
    <div id="app-shell"></div>
  </div>

  <!-- Protocol Check for direct file:// open -->
  <script>
    if (window.location.protocol === 'file:') {
      window.addEventListener('DOMContentLoaded', () => {
        const screen = document.getElementById('loading-screen');
        if (screen) {
          screen.classList.remove('hide');
          screen.innerHTML = `
            <div style="text-align:center;padding:2rem;max-width:480px;background:#fff;border-radius:24px;box-shadow:0 12px 40px rgba(44,34,25,0.12);margin:1.5rem;direction:rtl;font-family:'Plus Jakarta Sans',sans-serif;border:1px solid #E6DEC8;">
              <div style="font-size:3.5rem;margin-bottom:1rem">🌿</div>
              <h2 style="color:#2C2219;margin-bottom:0.75rem;font-size:1.35rem;font-weight:700">تم فتح الملف بشكل مباشر (file://)</h2>
              <p style="color:#6E6053;font-size:0.92rem;line-height:1.7;margin-bottom:1.25rem">
                متصفحات الويب تحظر تحميل وحدات الجافاسكريبت والأصوات محلياً بدون خادم. لكي يعمل التطبيق بشكل كامل:
              </p>
              <div style="background:#F4EFE6;padding:1.1rem;border-radius:14px;margin-bottom:1.25rem;text-align:right;">
                <p style="font-weight:700;color:#2C2219;margin-bottom:0.5rem;font-size:0.95rem">خطوتان بسيطتان للتشغيل:</p>
                <ol style="margin:0;padding-right:1.2rem;color:#4A3B32;font-size:0.88rem;line-height:1.8">
                  <li>شغّل ملف <code style="background:#fff;padding:2px 8px;border-radius:6px;font-weight:bold;color:#B88E4F">run_app.bat</code> بالنقر المزدوج عليه.</li>
                  <li>أو ادخل على الرابط التالي في المتصفح:</li>
                </ol>
                <div style="margin-top:0.85rem;text-align:center">
                  <a href="http://localhost:5500" style="display:inline-block;padding:9px 22px;background:#2C2219;color:#FAF7F2;text-decoration:none;border-radius:10px;font-weight:600;font-size:0.95rem;">
                    http://localhost:5500
                  </a>
                </div>
              </div>
            </div>
          `;
        }
      });
    }
  </script>

  <!-- Bootstrap -->
  <script type="module">
    function hideLoadingScreen() {
      const loader = document.getElementById('loading-screen');
      if (loader && !loader.classList.contains('hide')) {
        loader.classList.add('hide');
        setTimeout(() => loader.remove(), 400);
      }
    }

    // Dismiss on load or if already loaded
    if (document.readyState === 'complete') {
      setTimeout(hideLoadingScreen, 300);
    } else {
      window.addEventListener('load', () => setTimeout(hideLoadingScreen, 400));
    }

    // Safety timeout: ensure loader never blocks the app
    setTimeout(hideLoadingScreen, 1500);

    // Boot app with cache-busting timestamp
    const cacheBuster = '?v=' + Date.now();
    import('./src/main.js' + cacheBuster)
      .then(() => {
        setTimeout(hideLoadingScreen, 200);
      })
      .catch(err => {
        console.error('Ghiras: Failed to load app', err);
        const screen = document.getElementById('loading-screen');
        if (screen) {
          screen.classList.remove('hide');
          screen.innerHTML = `
            <div style="text-align:center;padding:2rem;color:#2C2219;direction:rtl;font-family:sans-serif">
              <div style="font-size:3rem;margin-bottom:1rem">⚠️</div>
              <h2 style="font-family:sans-serif;margin-bottom:0.5rem">خطأ في تحميل التطبيق</h2>
              <p style="color:#6E6053;font-family:sans-serif;font-size:0.875rem">يرجى التأكد من تشغيل التطبيق عبر الرابط: <a href="http://localhost:5500">http://localhost:5500</a></p>
              <p style="color:#ba1a1a;font-size:0.8rem;margin-top:0.5rem;direction:ltr">${err.message || err}</p>
            </div>
          `;
        }
      });
  </script>

</body>
</html>
